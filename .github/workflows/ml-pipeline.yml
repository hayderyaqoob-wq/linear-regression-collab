# .github/workflows/ml-pipeline.yml
name: ML Training & Prediction Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allow manual triggering with custom x value
  workflow_dispatch:
    inputs:
      x_value:
        description: 'X value to predict Y (optional)'
        required: false
        type: string
        default: '5.0'

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Training & Prediction
      env:
        # Pass the manual input (or default) as env var to Python script
        PREDICT_X: ${{ inputs.x_value || '5.0' }}
      run: |
        echo "🔍 Running prediction for x=${{ env.PREDICT_X }}"
        python src/main.py

    - name: Upload Results (Optional)
      # Example: Save prediction output to a file for artifacts
      if: ${{ inputs.x_value != '' }}
      run: |
        echo "Prediction completed for x=${{ env.PREDICT_X }}" > prediction_result.txt
        python src/main.py >> prediction_result.txt 2>&1
        
    - name: Upload Prediction Artifact
      uses: actions/upload-artifact@v4
      if: ${{ inputs.x_value != '' }}
      with:
        name: prediction-output
        path: prediction_result.txt
        retention-days: 7